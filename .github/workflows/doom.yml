# Playable DOOM in the profile README - the move loop.
#
# RFC 001 component 5. The workflow is a THIN ORCHESTRATOR: every piece of game
# logic lives in the checked-in, unit-tested scripts under game/scripts/. The
# only things this file decides are ordering, permissions, and failure class.
#
# Hard invariants enforced here (each is grep-checkable):
#   - runs-on is the pinned ubuntu-24.04 label, never ubuntu-latest (the 26.04
#     image is in public preview and the alias will migrate underneath us; the
#     runner image is a determinism dependency - D12).
#   - github.event.issue.title appears ONLY inside `if:` expressions. It is
#     never interpolated into a `run:` block and never written to GITHUB_ENV or
#     GITHUB_OUTPUT (security #2). `if:` expressions are not a shell-injection
#     surface; run-block interpolation is, and it is forbidden.
#   - The gate is expression-native only (startsWith + contains/fromJSON set
#     membership - D15). Actions expressions have no regex function; a shell
#     regex shim would be exactly the template-injection RCE. The anchored,
#     byte-exact, ASCII-only match lives in game/scripts/parse_title.py, which
#     reads the title from a JSON file - never argv, never a shell.
#   - No `secrets.` reference anywhere: the default GITHUB_TOKEN, reached via
#     ${{ github.token }}, is the entire credential surface (D8). Its pushes
#     cannot retrigger this workflow, which is the loop guard.
#   - Per-job least privilege; the workflow default is no permissions at all.
#   - One concurrency group for every game-state writer, cancel-in-progress
#     false. Correctness comes from the drain invariant, not from queueing.
#
# The drain invariant (RFC, named and load-bearing): every run re-reads all
# pending input from the API and never trusts its own event payload. That is
# what makes coalescing-cancelation, sweeps and manual re-runs re-entrant.

name: doom

on:
  issues:
    types: [opened]
  # SPEC section 6 knob `sweep_cron`: every 6 h at :17, an off-peak minute
  # (schedule delivery can lag 10+ minutes at busy cron windows - fine for a
  # safety net). The sweep no-ops cheaply when there is no pending input.
  schedule:
    - cron: '17 */6 * * *'
  # The operator entry point: drain/re-render, UNAVAILABLE recovery, and the
  # pre-merge rehearsal path. See game/RUNBOOK.md.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run the full drain and parse path with every push, close and receipt disabled.
        type: boolean
        default: false
      simulate_title:
        description: Extra synthetic issue title to push through the drain. Honored only when dry_run is true.
        type: string
        default: ''

# Everything else none (security #4). Each job opts in to exactly what it needs.
permissions: {}

defaults:
  run:
    shell: bash

env:
  # Same fixed string as REJECT_MESSAGES['unlisted-token'] in
  # game/scripts/parse_title.py. The gate job has no checkout by design, so it
  # cannot call the parser; this is the one deliberate duplication of a
  # visitor-facing string in the pipeline.
  REJECT_MESSAGE: 'unrecognized command — use one of the control links in the README'
  INVALID_LABEL: invalid-move
  MAINTENANCE_LABEL: doom-maintenance
  # Inactivity threshold for the PAUSED swap. "Well before day 60" (the
  # scheduled-workflow auto-disable horizon) - not a SPEC knob, chosen here;
  # see the E5 report. The swap is also the repo activity that keeps the
  # schedule alive, but do not rely on that: game/RUNBOOK.md documents the
  # manual `gh workflow enable` re-arm.
  IDLE_PAUSE_DAYS: '45'

jobs:
  # --------------------------------------------------------------------------
  # Gate: closes issues that look like a move but are not one.
  #
  # This job starts ONLY for a `doom: `-prefixed title that is not an exact
  # member of the 56 canonical literals, so valid moves never pay for it and
  # invalid ones never reach the heavy job - spend per troll is a one-minute,
  # checkout-free job. It is deliberately NOT in the game-state concurrency
  # group: it touches no game state, and serializing it behind a render would
  # delay reject feedback for no benefit.
  #
  # The set literal below is generated verbatim from game/mapping/v1.json:
  #   jq -c .canonical_titles game/mapping/v1.json
  # Note honestly: Actions expression comparisons are case-insensitive, so
  # `DOOM: Forward` passes both startsWith and contains here and is handed to
  # the heavy job, where the byte-exact parser declines to consume it and the
  # issue is left open like any other non-command issue. There is no
  # case-sensitive primitive in the expression language; see the E5 report.
  # --------------------------------------------------------------------------
  gate:
    name: Gate (close non-canonical move issues)
    if: >-
      github.event_name == 'issues'
      && startsWith(github.event.issue.title, 'doom: ')
      && !contains(fromJSON('["doom: forward","doom: forward x2","doom: forward x3","doom: forward x4","doom: forward x5","doom: forward x6","doom: forward x7","doom: forward x8","doom: forward x9","doom: back","doom: back x2","doom: back x3","doom: back x4","doom: back x5","doom: back x6","doom: back x7","doom: back x8","doom: back x9","doom: turn-left","doom: turn-left x2","doom: turn-left x3","doom: turn-left x4","doom: turn-left x5","doom: turn-left x6","doom: turn-left x7","doom: turn-left x8","doom: turn-left x9","doom: turn-right","doom: turn-right x2","doom: turn-right x3","doom: turn-right x4","doom: turn-right x5","doom: turn-right x6","doom: turn-right x7","doom: turn-right x8","doom: turn-right x9","doom: fire","doom: fire x2","doom: fire x3","doom: fire x4","doom: fire x5","doom: fire x6","doom: fire x7","doom: fire x8","doom: fire x9","doom: use","doom: run-forward","doom: run-forward x2","doom: run-forward x3","doom: run-forward x4","doom: run-forward x5","doom: run-forward x6","doom: run-forward x7","doom: run-forward x8","doom: run-forward x9","doom: new game"]'), github.event.issue.title)
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions:
      # Nothing else: no checkout, no `contents` at all, so this job structurally
      # cannot touch game state.
      issues: write # comment, label and close the offending issue
    concurrency:
      # Deliberately NOT the game-state group - rejecting a bad title must not
      # queue behind a render. Per-issue, so two bad issues reject in parallel.
      group: doom-gate-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Label and close with the fixed rejection message
        env:
          GH_TOKEN: ${{ github.token }}
          # The issue NUMBER (an integer chosen by GitHub) is the only piece of
          # event data this job needs. The title never crosses into the script.
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}"

          # Idempotent label bootstrap; a 422 here means it already exists.
          jq -n --arg name "${INVALID_LABEL}" \
            '{name: $name, color: "b60205", description: "A doom: issue that is not a canonical move"}' \
            | gh api --silent -X POST "repos/${GITHUB_REPOSITORY}/labels" --input - || true

          jq -n --arg body "${REJECT_MESSAGE}" '{body: $body}' \
            | gh api --silent -X POST "${api}/comments" --input -
          jq -n --arg name "${INVALID_LABEL}" '{labels: [$name]}' \
            | gh api --silent -X POST "${api}/labels" --input -
          jq -n '{state: "closed", state_reason: "not_planned"}' \
            | gh api --silent -X PATCH "${api}" --input -

  # --------------------------------------------------------------------------
  # Play: the heavy job. Drain -> apply -> simulate -> encode -> rewrite ->
  # publish -> close, plus the scheduled sweep duties.
  #
  # No `needs:` on the gate job on purpose: the two are mutually exclusive, and
  # chaining them would put a second runner pickup (10-60 s, the dominant term
  # in the latency budget) on the critical path of every real move.
  # --------------------------------------------------------------------------
  play:
    name: Play (drain, simulate, encode, publish)
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || contains(fromJSON('["doom: forward","doom: forward x2","doom: forward x3","doom: forward x4","doom: forward x5","doom: forward x6","doom: forward x7","doom: forward x8","doom: forward x9","doom: back","doom: back x2","doom: back x3","doom: back x4","doom: back x5","doom: back x6","doom: back x7","doom: back x8","doom: back x9","doom: turn-left","doom: turn-left x2","doom: turn-left x3","doom: turn-left x4","doom: turn-left x5","doom: turn-left x6","doom: turn-left x7","doom: turn-left x8","doom: turn-left x9","doom: turn-right","doom: turn-right x2","doom: turn-right x3","doom: turn-right x4","doom: turn-right x5","doom: turn-right x6","doom: turn-right x7","doom: turn-right x8","doom: turn-right x9","doom: fire","doom: fire x2","doom: fire x3","doom: fire x4","doom: fire x5","doom: fire x6","doom: fire x7","doom: fire x8","doom: fire x9","doom: use","doom: run-forward","doom: run-forward x2","doom: run-forward x3","doom: run-forward x4","doom: run-forward x5","doom: run-forward x6","doom: run-forward x7","doom: run-forward x8","doom: run-forward x9","doom: new game"]'), github.event.issue.title)
    runs-on: ubuntu-24.04
    # A hung run (stuck ffmpeg pipe, wedged push retry) must not hold the game's
    # concurrency group for the 6 h default.
    timeout-minutes: 10
    permissions:
      contents: write # commit ledger/stream/README, force the GIF to the output branch
      issues: write # close drained issues and post the receipts from the drain plan
    concurrency:
      # One group for every writer - event runs, the sweep and manual dispatch.
      # This, not the queue, is the global serialization bound.
      group: doom-game-state
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ inputs.dry_run == true }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      LEDGER: game/state/log.txt
      STREAM: game/state/stream.txt
      MAPPING: game/mapping/v1.json
      TOOLCHAIN: game/toolchain.json
      # Cutover flag (plan D5). The control table ships DISABLED and is
      # switched on last, in one reviewable commit, at E9 stage 2. Every
      # render in this workflow honours it, so the committed block and the
      # rendered block can never disagree about whether controls are live.
      CONTROLS_ENABLED: 'false'
      # Relative repo paths, matching what E6 committed and the convention
      # of the profile's existing octocat.gif. State screens are static
      # committed assets, so they need no ?run= buster: a swap changes the
      # filename, which is already a fresh Camo cache key. Only the GIF -
      # which lives on the force-pushed output branch under one fixed name -
      # needs the buster (D5/D10).
      SCREEN_PAUSED: game/assets/screens/paused.png
      SCREEN_UNAVAILABLE: game/assets/screens/unavailable.png
      # The two in-band guidance screens (SPEC section 11). Neither is a
      # failure display: a run that shows one of these SUCCEEDED - it drained,
      # it rejected in band, it closed the rejected issues with their fixed
      # guidance message, and it had zero ledger appends to make (SPEC section
      # 10, degraded-mode note). Which one is selected off drain.py's `sealed`
      # and `section-cap` reason codes - never off the player-visible prose.
      SCREEN_LOG_FULL: game/assets/screens/log-full.png
      SCREEN_SEALED: game/assets/screens/sealed.png
    steps:
      - name: Checkout game state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # The pushes below ride the checkout's credential helper; no token is
          # ever written into a command line or a remote URL.
          #
          # zizmor's `artipacked` audit flags this at the auditor persona (it is
          # clean at the default and pedantic personas): persisted credentials
          # leak only through an artifact upload of the .git directory, and this
          # repository uploads no artifacts from any workflow. The alternative -
          # an explicit token in a remote URL - is strictly worse. Deliberate.
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            game
            README.md

      - name: Configure the committer identity
        run: |
          set -euo pipefail
          # Fixed bot identity. Player handles are never written into a commit
          # message (mention-spam vector, security #3).
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      # --- scheduled sweep guard: abuse volume, owner alerting, idleness ------

      - name: Sweep guard (abuse volume, owner alerting, idleness)
        id: guard
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          runs_api="repos/${GITHUB_REPOSITORY}/actions/workflows/doom.yml/runs"
          since="$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)"

          # Trailing-24h run volume (SPEC section 6: 200 runs / 24 h).
          threshold="$(jq -r '.knobs.abuse_trailing_24h_run_threshold' "${MAPPING}")"
          volume="$(gh api -X GET "${runs_api}" -f "created=>${since}" -F per_page=1 --jq '.total_count')"

          # Consecutive failed move runs (SPEC section 6: 2).
          fail_threshold="$(jq -r '.knobs.sweep_owner_alert_consecutive_failures' "${MAPPING}")"
          failures="$(gh api -X GET "${runs_api}" -f status=completed -F per_page=10 \
            --jq '[.workflow_runs[].conclusion] | (map(. == "failure") | index(false) // length)')"

          # Days since the last game-state commit.
          last="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/commits" \
            -f "path=${LEDGER}" -F per_page=1 --jq '.[0].commit.committer.date // empty')"
          if [ -n "$last" ]; then
            idle_days=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 86400 ))
          else
            idle_days=0
          fi

          halt=false
          if [ "$volume" -gt "$threshold" ]; then halt=true; fi
          idle=false
          if [ "$idle_days" -ge "${IDLE_PAUSE_DAYS}" ]; then idle=true; fi

          {
            echo "halt=${halt}"
            echo "idle=${idle}"
            echo "alert=$( [ "$failures" -ge "$fail_threshold" ] && echo true || echo false )"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Sweep guard"
            echo ""
            echo "- trailing-24h runs: ${volume} (threshold ${threshold}) -> halt=${halt}"
            echo "- consecutive failed runs: ${failures} (threshold ${fail_threshold})"
            echo "- days since last game-state commit: ${idle_days} (threshold ${IDLE_PAUSE_DAYS}) -> idle=${idle}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Alert the owner
        if: steps.guard.outputs.alert == 'true' || steps.guard.outputs.halt == 'true'
        env:
          HALTED: ${{ steps.guard.outputs.halt }}
        run: |
          set -euo pipefail
          # Workflow-failure notifications go to the triggering visitor, not to
          # the owner - so the sweep opens/updates a maintenance issue instead.
          jq -n --arg name "${MAINTENANCE_LABEL}" \
            '{name: $name, color: "d93f0b", description: "DOOM pipeline needs operator attention"}' \
            | gh api --silent -X POST "repos/${GITHUB_REPOSITORY}/labels" --input - || true

          existing="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/issues" \
            -f state=open -f "labels=${MAINTENANCE_LABEL}" -F per_page=1 --jq '.[0].number // empty')"

          if [ "${HALTED}" = "true" ]; then
            body="The trailing-24h run volume crossed the abuse threshold. The README has been flipped to PAUSED and move processing is halted for this sweep. See ${RUN_URL} and game/RUNBOOK.md section 7."
          else
            body="The DOOM move loop has failed on consecutive runs. Moves are still safe: unprocessed moves stay open as issues and the next green run drains them. See ${RUN_URL} and game/RUNBOOK.md section 1."
          fi

          if [ -n "$existing" ]; then
            jq -n --arg body "$body" '{body: $body}' \
              | gh api --silent -X POST "repos/${GITHUB_REPOSITORY}/issues/${existing}/comments" --input -
          else
            jq -n --arg body "$body" --arg label "${MAINTENANCE_LABEL}" --arg who "${GITHUB_REPOSITORY_OWNER}" \
              '{title: "DOOM pipeline needs attention", body: $body, labels: [$label], assignees: [$who]}' \
              | gh api --silent -X POST "repos/${GITHUB_REPOSITORY}/issues" --input -
          fi

      - name: Halt and show PAUSED
        if: steps.guard.outputs.halt == 'true'
        run: |
          set -euo pipefail
          controls=()
          if [ "${CONTROLS_ENABLED}" = "true" ]; then controls=(--controls-enabled); fi
          python3 game/scripts/rewrite_readme.py --readme README.md --mapping "${MAPPING}" \
            --state PAUSED "${controls[@]}" \
            --image-url "${SCREEN_PAUSED}"
          git add -- README.md
          git commit -q -m "chore(doom): pause the game (run ${GITHUB_RUN_ID})" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # --- drain: always re-read every pending move from the API -------------

      - name: Collect open move issues
        if: steps.guard.outputs.halt != 'true'
        run: |
          set -euo pipefail
          # The drain invariant: the event payload is never the input. Only the
          # four fields drain.py consumes are projected, and they land in a JSON
          # file - visitor text never becomes a shell word.
          gh api --paginate -X GET "repos/${GITHUB_REPOSITORY}/issues" \
            -f state=open -f sort=created -f direction=asc -F per_page=100 \
            --jq '.[] | select(has("pull_request") | not)
                      | {number, title, created_at, user: {login: .user.login}}' \
            | jq -s '.' > "${RUNNER_TEMP}/issues.json"
          echo "open doom-eligible candidates: $(jq '[.[] | select(.title | startswith("doom: "))] | length' "${RUNNER_TEMP}/issues.json")"

      - name: Inject the simulated title (dry run only)
        if: steps.guard.outputs.halt != 'true' && env.DRY_RUN == 'true' && inputs.simulate_title != ''
        env:
          # Dispatch inputs are operator-supplied, so they get the same
          # treatment as visitor text: env transport into jq --arg, never a
          # shell word, never a run-block interpolation.
          SIMULATE_TITLE: ${{ inputs.simulate_title }}
        run: |
          set -euo pipefail
          jq --arg title "${SIMULATE_TITLE}" --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '. + [{number: 999999999, title: $title, created_at: $now, user: {login: "simulated"}}]' \
            "${RUNNER_TEMP}/issues.json" > "${RUNNER_TEMP}/issues.next.json"
          mv "${RUNNER_TEMP}/issues.next.json" "${RUNNER_TEMP}/issues.json"

      - name: Drain pending moves
        if: steps.guard.outputs.halt != 'true'
        run: |
          set -euo pipefail
          # Seven-step exactly-once drain (D14): ascending issue number, skip
          # anything already in the ledger, per-run cap, TOCTOU re-validation
          # through the parser, new-game cooldown and section cap, ledger lines
          # out, and a post_push plan whose GitHub side effects this workflow
          # executes strictly after the pushes.
          #
          # --toolchain is how the drain computes SEALED mode (SPEC 5.5):
          # it compares the current section header against the committed pins
          # and, when they disagree, admits only `doom: new game` and
          # close-rejects everything else instead of failing the run - refusing
          # the batch would livelock, since the drain is ascending by issue
          # number and would re-refuse the same low-numbered issue forever.
          # This runs BEFORE the toolchain restore on purpose: the comparand is
          # the checked-out game/toolchain.json, not the restored binary, so an
          # idle sweep still exits without ever touching the engine cache.
          python3 game/scripts/drain.py \
            --issues "${RUNNER_TEMP}/issues.json" \
            --ledger "${LEDGER}" \
            --mapping "${MAPPING}" \
            --toolchain "${TOOLCHAIN}" \
            --out-moves "${RUNNER_TEMP}/moves.txt" \
            --out-actions "${RUNNER_TEMP}/actions.json"

      - name: Decide whether there is work
        id: work
        if: steps.guard.outputs.halt != 'true'
        run: |
          set -euo pipefail
          # must_have 7: with no pending input the sweep stops here, before the
          # toolchain restore and long before the engine. Two API reads and a
          # sparse checkout is the whole cost of an idle sweep.
          moves=false
          if [ -s "${RUNNER_TEMP}/moves.txt" ]; then moves=true; fi
          closes="$(jq -r '.post_push | length > 0' "${RUNNER_TEMP}/actions.json")"

          # --- the drain's contract, validated before anything is derived -----
          #
          # Everything below reads drain.py's machine-readable fields and
          # nothing else. SPEC 5.7 makes the six reason codes a normative CLOSED
          # enum and SPEC 5.8 makes the three section states another; both are
          # mirrored in the mapping, and both carry the same consumer rule: no
          # consumer may string-match a player-visible message (those are
          # written for humans and may be reworded; the codes may not), and no
          # consumer may re-derive a normative predicate (SPEC 0.5). So nothing
          # here matches prose, and both enums are read from the mapping rather
          # than retyped into YAML.
          #
          # SPEC 5.7: "a drained issue that matches no row is a bug, not a
          # seventh outcome". Fail loudly on one rather than let it fall through
          # the arithmetic below, where an unrecognized code would silently
          # count as a rejection.
          # tojson, not the bare value: an entry with NO `reason` field at all
          # yields null, and `join` renders null as the empty string - which
          # would leave $unknown empty and wave the defect straight through the
          # guard meant to catch it. tojson renders it as the literal `null`,
          # so a missing code is reported instead of silently admitted.
          unknown="$(jq -r --slurpfile m "${MAPPING}" \
            '[.post_push[].reason | select(. as $r | ($m[0].reason_codes | index($r)) == null)]
             | unique | map(tojson) | join(", ")' \
            "${RUNNER_TEMP}/actions.json")"
          if [ -n "$unknown" ]; then
            echo "::error::the drain emitted reason code(s) outside the SPEC 5.7 closed enum: ${unknown}. That is a defect in the drain, not a seventh outcome - refusing to act on the plan."
            exit 1
          fi

          # --- the SPEC 5.8 section state, and the screen it selects ----------
          #
          # SPEC 5.8 clause 1 makes the `section` member unconditional on every
          # exit-0 drain, so its ABSENCE is a contract violation and never
          # "nothing to report": `open` is the value that says nothing to
          # report, absence says the drain never told me, and those are
          # different facts about different things. Defaulting absence to "no
          # screen" would convert a broken producer into a silent one in
          # exactly the case SPEC 5.8 exists to close - a sealed game left
          # showing a stale live frame, indistinguishable from a healthy quiet
          # run. All three deformations (member absent, present but not an
          # object, present with no `state` key) are the same fault and take
          # this same path.
          #
          # Checked BEFORE `.section.state` is read: indexing a string with
          # `.state` is a jq error, and a jq error inside a command
          # substitution ends the step with no `::error::` line behind it -
          # reporting a contract violation as a harness crash.
          if [ "$(jq -r 'if (.section | type) == "object" then (.section | has("state")) else false end' \
                  "${RUNNER_TEMP}/actions.json")" != "true" ]; then
            echo "::error::the drain emitted no SPEC 5.8 section state (got section=$(jq -c '.section' "${RUNNER_TEMP}/actions.json")). The member is unconditional on every exit-0 drain, so its absence is a broken producer - refusing to act on the plan rather than reading it as 'nothing to report'."
            exit 1
          fi
          # Validated against mapping `section_states` exactly as the reason
          # codes are above, and with the same tojson discipline so a null or a
          # non-string is REPORTED rather than rendered as an empty string.
          # `index` is exact JSON equality, so the match is byte-exact and
          # `SEALED` is not `sealed` - the enum is a protocol, not prose.
          unknown_state="$(jq -r --slurpfile m "${MAPPING}" \
            '.section.state | select(. as $s | ($m[0].section_states | index($s)) == null) | tojson' \
            "${RUNNER_TEMP}/actions.json")"
          if [ -n "$unknown_state" ]; then
            echo "::error::the drain reported section state ${unknown_state}, which is outside the SPEC 5.8 closed enum in mapping section_states. That is a defect in the drain, not a fourth state - refusing to act on the plan."
            exit 1
          fi
          # SPEC 5.8 screen selection is a LOOKUP, not a predicate: this step
          # maps a value it was handed and hard-fails on an unmapped one,
          # rather than deciding for itself what "sealed" means. The pin
          # comparison (SPEC 5.5) and the cap comparison (SPEC 6) are made once,
          # by drain.py, which owns them; neither is re-derived here (SPEC 0.5),
          # and that is what made the missing field the correct fix rather than
          # a YAML-side workaround.
          #
          # Two guards, not one predicate written twice: the enum above is
          # authoritative over which states EXIST, and the arms below are the
          # SPEC section 11 screen table. A state the mapping lists and this
          # table does not map is precisely the "unmapped" case SPEC 5.8 says to
          # hard-fail on. These arms are bound to the swap step's own `case` by
          # test_the_swap_step_maps_exactly_the_screens_the_lookup_can_produce,
          # in both directions, so neither can grow an arm the other lacks.
          state="$(jq -r '.section.state' "${RUNNER_TEMP}/actions.json")"
          case "$state" in
            sealed) state_screen=SEALED ;;
            capped) state_screen=LOG_FULL ;;
            open)   state_screen='' ;;
            *) echo "::error::no SPEC section 11 screen is mapped for section state '${state}' - refusing to render an unmapped state"; exit 1 ;;
          esac
          #
          # "Drained" excludes `duplicate`: an issue whose number is already in
          # the ledger is close-only cleanup. It never consumed the per-run cap
          # and was never a candidate for this run, so counting it would make a
          # pure cleanup sweep look like a rejected batch.
          drained="$(jq -r '[.post_push[] | select(.reason != "duplicate")] | length' "${RUNNER_TEMP}/actions.json")"
          applied="$(jq -r '[.post_push[] | select(.reason == "applied")] | length' "${RUNNER_TEMP}/actions.json")"

          # The two tables must agree by construction - `applied` is the only
          # reason that yields a ledger line. A disagreement means either the
          # close plan or the ledger batch is wrong, and acting on either would
          # close issues that never reached the ledger (the D14 lost-move
          # failure) or swap the wrong screen. Fail here, pre-push: nothing is
          # written, the moves stay open, the next run re-drains them.
          ledger_lines=0
          if [ -s "${RUNNER_TEMP}/moves.txt" ]; then
            ledger_lines="$(wc -l < "${RUNNER_TEMP}/moves.txt" | tr -d ' ')"
          fi
          if [ "$ledger_lines" -ne "$applied" ]; then
            echo "::error::the drain emitted ${ledger_lines} ledger line(s) but ${applied} 'applied' close(s) - the plan and the batch disagree, refusing to act on either"
            exit 1
          fi

          # all_rejected: at least one move was drained and not one of them was
          # applied. This is a SUCCESS condition, not a failure - and after
          # SPEC 5.8 it is a SUMMARY signal only. It no longer selects a screen.
          #
          # It cannot, and the residual this comment used to carry is what
          # proved it: the reason codes witness a section's state only where
          # there was a move to reject, so a section sealed or capped while
          # nobody is submitting moves emitted no code and swapped no screen.
          # That gap is closed by SPEC 5.8's section state, read above, and is
          # not restated here - the field is unconditional, the derivation is
          # drain.py's, and this step is a lookup.
          #
          # SPEC 11 rule 2 also makes all-rejected the wrong condition in the
          # other direction: a batch whose applied moves carry the section over
          # the SPEC 6 cap ends `capped` AND publishes a frame, so all_rejected
          # is false on a run that genuinely has a state to report. The correct
          # condition is "state selects the screen, and a publish suppresses
          # it", which is where the swap step's `if:` implements it.
          #
          # What all_rejected still answers, and the only thing it is read for:
          # did this run decline everything it drained? The run summary says so
          # in prose, and a batch declined only for `grammar` or `cooldown` is
          # ordinary operation on a live game with an accurate frame on display.
          all_rejected=false
          if [ "$drained" -gt 0 ] && [ "$applied" -eq 0 ]; then
            all_rejected=true
          fi

          {
            echo "moves=${moves}"
            echo "closes=${closes}"
            echo "all_rejected=${all_rejected}"
            echo "state_screen=${state_screen}"
          } >> "$GITHUB_OUTPUT"
          echo "moves=${moves} closes=${closes} drained=${drained} applied=${applied} all_rejected=${all_rejected} section=${state} state_screen=${state_screen:-none}"

      # --- render: toolchain, apply, simulate, encode ------------------------

      - name: Restore the pinned toolchain
        id: toolchain
        if: steps.work.outputs.moves == 'true'
        uses: ./.github/actions/doom-toolchain

      - name: Apply moves to the ledger and regenerate the stream
        id: apply
        if: steps.work.outputs.moves == 'true'
        env:
          ENGINE_BUILD_SHA256: ${{ steps.toolchain.outputs.engine-build-sha256 }}
        run: |
          set -euo pipefail
          # Appends the drained ledger lines, rolls the section over on a
          # `new game` directive, regenerates stream.txt as expand(ledger) for
          # the current section, and refuses to run when the current section
          # header's engine/build/WAD/mapping pins disagree with the running
          # toolchain (RFC determinism guarantees - a mismatch must never
          # silently fork the timeline).
          # Exit taxonomy (pinned by game/tests/test_apply_moves.py):
          #   0 ok / 2 usage / 5 corrupt content / 7 determinism pin mismatch.
          # 7 is branched on deliberately - it is not an error in the pipeline,
          # it is the guard doing its job, and it is permanent: every retry,
          # sweep and new move fails identically until the running toolchain and
          # the current section header agree. Every non-zero exit leaves the
          # ledger and the stream byte-untouched (atomic writes, guaranteed by
          # the contract), so this lands on the pre-push row of the write
          # contract: no game state written, moves stay open, best-effort
          # UNAVAILABLE swap.
          rc=0
          python3 game/scripts/apply_moves.py \
            --ledger "${LEDGER}" \
            --moves "${RUNNER_TEMP}/moves.txt" \
            --mapping "${MAPPING}" \
            --toolchain "${TOOLCHAIN}" \
            --engine-build-sha256 "${ENGINE_BUILD_SHA256}" \
            --stream "${STREAM}" || rc=$?

          if [ "$rc" -eq 7 ]; then
            echo "pin-mismatch=true" >> "$GITHUB_OUTPUT"
            header="$(grep '^#section ' "${LEDGER}" | tail -1)"
            {
              echo "### Refused: determinism pin mismatch"
              echo ""
              echo "The current section header and the running toolchain disagree."
              echo "Nothing was written: the ledger and stream are byte-untouched and"
              echo "every drained move is still an open issue. Retrying reproduces this"
              echo "exactly until the pins agree. See game/RUNBOOK.md section 1."
              echo ""
              echo "| pin | current section header | running toolchain |"
              echo "| --- | --- | --- |"
              for field in engine build wad mapping; do
                observed="$(printf '%s\n' "$header" | tr ' ' '\n' | sed -n "s/^${field}=//p")"
                case "$field" in
                  engine)  running="$(jq -r '.engine.commit_sha' "${TOOLCHAIN}")" ;;
                  build)   running="${ENGINE_BUILD_SHA256}" ;;
                  wad)     running="$(jq -r '.wad.sha256' "${TOOLCHAIN}")" ;;
                  mapping) running="$(jq -r '.mapping_version' "${MAPPING}")" ;;
                  *)       running='' ;;
                esac
                mark=''
                if [ "$observed" != "$running" ]; then mark=' **differs**'; fi
                echo "| \`${field}\` | \`${observed}\` | \`${running}\`${mark} |"
              done
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::determinism pin mismatch - refusing to run rather than silently forking the timeline. No game state was written; the drained moves remain open. See the run summary and game/RUNBOOK.md section 1."
            exit 1
          fi

          if [ "$rc" -ne 0 ]; then
            echo "::error::apply_moves.py failed with exit ${rc} (2=usage, 5=corrupt input); the ledger and stream are byte-untouched"
            exit 1
          fi

      - name: Simulate the current section
        id: simulate
        if: steps.work.outputs.moves == 'true'
        env:
          ENGINE_BIN: ${{ steps.toolchain.outputs.engine-bin }}
        run: |
          set -euo pipefail
          fps="$(jq -r '.engine_fps' "${MAPPING}")"
          max_tail="$(jq -r '[.budget.ladder[].tail_seconds] | max' "${MAPPING}")"
          resolution="$(jq -r '.engine.resolution' "${TOOLCHAIN}")"
          width="${resolution%x*}"
          height="${resolution#*x}"
          wad="$(jq -r '.wad.file' "${TOOLCHAIN}")"

          # SPEC section 1: menu navigation from boot into gameplay is a fixed
          # engine-invocation constant owned by the toolchain, NOT part of the
          # public grammar - no token expands to the menu keys e/x. Fail loudly
          # rather than silently rendering the title screen for every player.
          bootstrap="$(jq -r '.engine.bootstrap_stream // empty' "${TOOLCHAIN}")"
          bootstrap_frames="$(jq -r '.engine.bootstrap_frames // empty' "${TOOLCHAIN}")"
          if [ -z "$bootstrap" ] || [ -z "$bootstrap_frames" ]; then
            echo "::error::${TOOLCHAIN} is missing .engine.bootstrap_stream or .engine.bootstrap_frames - without the recorded boot-to-gameplay prefix and its length the replay renders the menu, silently."
            exit 1
          fi

          # The preamble is prepended to the section's own stream. An empty
          # section (every `new game` rollover) leaves stream.txt as a bare LF,
          # so the separator is only correct when there is something to separate
          # - otherwise it would append a phantom empty frame and skew the
          # frame arithmetic below.
          input="${RUNNER_TEMP}/sim.stream"
          if [ -s "${STREAM}" ] && [ "$(cat "${STREAM}")" != "" ]; then
            printf '%s,' "$bootstrap" > "$input"
            cat "${STREAM}" >> "$input"
          else
            printf '%s\n' "$bootstrap" > "$input"
          fi
          n_frames=$(( $(tr -cd ',' < "$input" | wc -c) + 1 ))
          n_record=$(( max_tail * fps ))

          # -nstart is NOT optional. Left to itself the engine computes
          # n_start = n_frames - n_record, which goes NEGATIVE whenever the
          # section is shorter than the tail window - and a negative start
          # records from frame 0, i.e. from the menu walk. That is the state
          # immediately after every `new game`, so the profile's first-ever
          # visitor would be shown the Freedoom title screen. Floor it at the
          # preamble length so the published tail can never reach back into it.
          n_start=$(( n_frames - n_record ))
          if [ "$n_start" -lt "$bootstrap_frames" ]; then n_start="$bootstrap_frames"; fi
          # An entry-less section has nothing after the preamble, and the engine
          # records the half-open window [n_start, n_frames) - so leave it one
          # frame to render: the last preamble frame is already the in-level
          # game-start view SPEC 5.5 calls for on a rollover recovery.
          if [ "$n_start" -ge "$n_frames" ]; then n_start=$(( n_frames - 1 )); fi

          shim="${RUNNER_TEMP}/shim"
          mkdir -p "$shim"
          install -m 0755 .github/toolchain/ffmpeg-shim.py "${shim}/ffmpeg"

          # doomreplay pipes to a subprocess it looks up as `ffmpeg` on PATH;
          # the shim captures the raw framebuffer instead. The real encoder is
          # always called by absolute path, so it can never be shadowed.
          PATH="${shim}:${PATH}" "${ENGINE_BIN}" \
            -iwad "$wad" \
            -input "$input" \
            -nstart "$n_start" \
            -nrecord "$n_record" \
            -output "${RUNNER_TEMP}/capture.raw" < /dev/null

          test -s "${RUNNER_TEMP}/capture.raw" || { echo "::error::the replay produced no frames"; exit 1; }
          frame_bytes=$(( width * height * 4 ))
          captured=$(( $(stat -c%s "${RUNNER_TEMP}/capture.raw") / frame_bytes ))
          echo "simulated ${n_frames} frame(s); recorded [${n_start}, ${n_frames}) = ${captured}"

          # Hold the final frame out to one second when the section is shorter
          # than that. ffmpeg cannot write a GIF from a single input frame at
          # all (it exits non-zero with an empty file), and a sub-second clip is
          # a blink. Padding is display-only: GIF bytes are explicitly outside
          # the determinism guarantee, and the ledger and stream are untouched.
          if [ "$captured" -lt "$fps" ]; then
            tail -c "$frame_bytes" "${RUNNER_TEMP}/capture.raw" > "${RUNNER_TEMP}/hold.raw"
            for _ in $(seq $(( fps - captured ))); do
              cat "${RUNNER_TEMP}/hold.raw" >> "${RUNNER_TEMP}/capture.raw"
            done
            echo "held the final frame out to ${fps} frame(s) for a legible still"
          fi
          {
            echo "fps=${fps}"
            echo "width=${width}"
            echo "height=${height}"
            echo "frame-bytes=$(( width * height * 4 ))"
          } >> "$GITHUB_OUTPUT"

      - name: Encode the GIF through the budget ladder
        id: encode
        if: steps.work.outputs.moves == 'true'
        env:
          FFMPEG_BIN: ${{ steps.toolchain.outputs.ffmpeg-bin }}
          FPS: ${{ steps.simulate.outputs.fps }}
          WIDTH: ${{ steps.simulate.outputs.width }}
          HEIGHT: ${{ steps.simulate.outputs.height }}
          FRAME_BYTES: ${{ steps.simulate.outputs.frame-bytes }}
        run: |
          set -euo pipefail
          gif="${RUNNER_TEMP}/doom.gif"
          verdict="${RUNNER_TEMP}/budget.json"
          published=false

          # SPEC 12.1 spends two integers on 12 and 13 because they send an
          # operator to two different places on the very first debugging step.
          # Collapsing them into one generic "budget.py failed" row throws away
          # precisely the distinction the section exists to create, so each gets
          # its own summary block and its own ::error:: line.
          #
          #   13 = the artifact is not the complete output of a GIF writer -
          #        wrong file type, empty, or truncated. A pipeline or toolchain
          #        fault. Size is irrelevant: a large non-GIF and a large
          #        truncated GIF both clear the floor and the ceiling.
          #   12 = the artifact IS a complete GIF that came out degenerate - the
          #        encode collapsed. A palette or pix_fmt fault.
          #
          # Neither descends the ladder: a smaller re-encode cannot change a
          # file's type, and it cannot repair a collapse either.
          #
          # THIS STEP DOES NOT IMPLEMENT THE STRUCTURAL PREDICATE. SPEC 12.1
          # step 1 is head AND tail - the GIF89a magic proves a writer started,
          # the 0x3B trailer proves one finished - with both constants read at
          # runtime from mapping budget.structure. budget.py owns that predicate
          # and enforces it unconditionally; it is unit-tested and it reads the
          # constants from the one place they are authored.
          #
          # A bash re-implementation here was removed deliberately. SPEC 0 is
          # explicit that a gate specified against its motivating instance drifts
          # from the class it must cover, and the copy that used to live here is
          # instance five: it tested `head -c 6` under a comment claiming it
          # caught "a 0-byte or truncated GIF" while reading no byte past offset
          # 5. Re-typing a normative predicate into YAML - in a language with no
          # test coverage, against constants it would have to re-read itself - is
          # how that hole came to exist in two places at once. What the workflow
          # keeps is the DIAGNOSIS (the summary block below), which is where
          # "logs better" actually lives; the PREDICATE stays in one place.
          structural_failure() {
            rung_at="$1"
            reported_size="$2"
            {
              echo "### Refused: the artifact is not a complete GIF (exit 13, structural)"
              echo ""
              echo "\`${rung_at}\` produced a file that does not carry both ends a GIF writer"
              echo "leaves behind: the \`GIF89a\` magic at the head and the \`0x3B\` trailer at"
              echo "the tail. Either the encoder emitted **the wrong kind of file**, or it"
              echo "**started writing a GIF and did not finish** - so this is a pipeline or"
              echo "toolchain fault, and size is not the question: a large non-GIF and a large"
              echo "truncated GIF both clear the floor and the ceiling."
              echo ""
              echo "| field | value |"
              echo "| --- | --- |"
              echo "| verdict | structural (exit 13) |"
              echo "| size | ${reported_size} bytes |"
              echo "| ladder descent | no - a re-encode cannot complete a file the encoder abandoned |"
              echo "| first thing to check | the encoder and its pipe: the pinned ffmpeg binary, its \`-f gif\` output, whether the rawvideo stdin carried frames at all, and whether the runner ran out of disk mid-write |"
              echo ""
              echo "Nothing was published: the ledger, the stream and the \`output\` branch are"
              echo "byte-untouched and every drained move is still an open issue. This is the"
              echo "pre-push row of the write contract (SPEC section 10)."
              echo "See game/RUNBOOK.md section 11."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "budget-failure=structure" >> "$GITHUB_OUTPUT"
            echo "::error::exit 13 - ${rung_at} produced an artifact that is not a complete GIF (${reported_size} bytes); nothing is published. Wrong file type or an unfinished write, not a size problem. See the run summary and game/RUNBOOK.md section 11."
          }

          for rung in $(jq -r '.budget.ladder[].level' "${MAPPING}"); do
            tail_seconds="$(jq -r --arg r "$rung" '.budget.ladder[] | select(.level == $r) | .tail_seconds' "${MAPPING}")"
            graph="$(jq -r --arg k "filtergraph_$(printf '%s' "$rung" | tr '[:upper:]' '[:lower:]')" '.encode[$k]' "${TOOLCHAIN}")"
            slice=$(( tail_seconds * FPS * FRAME_BYTES ))

            # THE encode gotcha: the engine emits BGRA with the alpha byte
            # zeroed. Declaring the rawvideo input as `bgra` makes GIF treat
            # every pixel as fully transparent and silently produces a few KB
            # of nothing - no error, no warning. It MUST be `bgr0`.
            # game/toolchain.json encode.pix_fmt_warning; gotchas/doomreplay.md
            tail -c "$slice" "${RUNNER_TEMP}/capture.raw" \
              | "${FFMPEG_BIN}" -hide_banner -nostdin -loglevel error -y \
                  -f rawvideo -framerate "${FPS}" -s "${WIDTH}x${HEIGHT}" -pix_fmt bgr0 -i - \
                  -filter_complex "$graph" -loop 0 -f gif "$gif"

            # Orchestration check, NOT the structural gate: did the subprocess
            # this step just ran leave a file behind at all? budget.py treats a
            # missing --file as a usage error (exit 2) on purpose - SPEC 12.1
            # calls that a malformed *invocation*, not a malformed *artifact* -
            # so catching it here keeps a vanished output from surfacing as a
            # confusing usage verdict. Existence only: emptiness and content are
            # the gate's business, and this must never grow into a second copy
            # of the predicate.
            if [ ! -e "$gif" ]; then
              echo "::error::${rung}: ffmpeg exited 0 but wrote no output file - nothing is published"
              exit 1
            fi

            # The verdict JSON is the machine-readable channel (SPEC 12.1):
            # hard_fail / next / reason / size / floor / ceiling. Branch on the
            # exit code, report from the JSON - so no normative number (the
            # floor, the ceiling) is ever retyped into this file.
            rc=0
            python3 game/scripts/budget.py --mapping "${MAPPING}" --rung "$rung" --file "$gif" > "$verdict" || rc=$?
            cat "$verdict" || true
            case "$rc" in
              0)  published=true; echo "rung=${rung}" >> "$GITHUB_OUTPUT"; break ;;
              10) echo "::notice::${rung} exceeds the ceiling - re-encoding at the next rung" ;;
              11)
                ceiling="$(jq -r '.ceiling' "$verdict")"
                size="$(jq -r '.size' "$verdict")"
                {
                  echo "### Refused: over the ceiling at the last ladder rung (exit 11)"
                  echo ""
                  echo "| field | value |"
                  echo "| --- | --- |"
                  echo "| verdict | ceiling (exit 11) |"
                  echo "| size | ${size} bytes |"
                  echo "| ceiling | ${ceiling} bytes |"
                  echo "| rung | \`${rung}\` (the last one - there is nothing smaller to descend to) |"
                  echo "| first thing to check | the ladder constants in \`game/mapping/v1.json\` against the measured encode rate in \`game/toolchain.json\` |"
                  echo ""
                  echo "Nothing was published. See game/RUNBOOK.md section 11."
                } >> "$GITHUB_STEP_SUMMARY"
                echo "budget-failure=ceiling" >> "$GITHUB_OUTPUT"
                echo "::error::exit 11 - the GIF still exceeds the ceiling at the last ladder rung; nothing is published. See game/RUNBOOK.md section 11."
                exit 1 ;;
              12)
                floor="$(jq -r '.floor' "$verdict")"
                size="$(jq -r '.size' "$verdict")"
                {
                  echo "### Refused: the encode collapsed (exit 12, below the publish floor)"
                  echo ""
                  echo "\`${rung}\` produced a **well-formed GIF that came out degenerate**. The"
                  echo "file is a real GIF - it is just far too small to be a real clip, which"
                  echo "is evidence that the encode is broken rather than mis-tuned. Distinct"
                  echo "from exit 13, where the artifact is not a GIF at all."
                  echo ""
                  echo "| field | value |"
                  echo "| --- | --- |"
                  echo "| verdict | floor (exit 12) |"
                  echo "| size | ${size} bytes |"
                  echo "| floor | ${floor} bytes (exclusive - at or below it is a hard fail) |"
                  echo "| ladder descent | no - a smaller re-encode makes a collapse smaller, not better |"
                  echo "| first thing to check | the palette path: the pinned \`-pix_fmt bgr0\` on the rawvideo input and the rung's filtergraph in \`game/toolchain.json\` |"
                  echo ""
                  echo "Nothing was published: the ledger, the stream and the \`output\` branch are"
                  echo "byte-untouched and every drained move is still an open issue. This is the"
                  echo "pre-push row of the write contract (SPEC section 10)."
                  echo "See game/RUNBOOK.md section 11."
                } >> "$GITHUB_STEP_SUMMARY"
                echo "budget-failure=floor" >> "$GITHUB_OUTPUT"
                echo "::error::exit 12 - ${rung} produced a well-formed but degenerate GIF (${size} bytes, at or below the ${floor}-byte floor); nothing is published. A palette/pix_fmt fault, not a wrong file. See the run summary and game/RUNBOOK.md section 11."
                exit 1 ;;
              13)
                # The sole structural detection path. SPEC 12.1 step precedence:
                # the first violated step alone produces the verdict, so a
                # malformed sub-floor artifact (a 2.4 KB PNG) lands here as 13
                # and never as 12 - a non-GIF's byte count is a property of the
                # wrong file, and reporting it as a floor violation would send
                # the operator into the palette path for a fault that is not in
                # the encoder's colour handling.
                structural_failure "$rung" "$(jq -r '.size' "$verdict")"
                exit 1 ;;
              *)
                echo "budget-failure=unexpected" >> "$GITHUB_OUTPUT"
                echo "::error::budget.py failed with exit ${rc}, which is outside its documented taxonomy (0/2/10/11/12/13) - treat this as a defect in the gate itself, not as a verdict about the artifact"
                exit 1 ;;
            esac
          done

          [ "$published" = true ] || { echo "::error::the budget ladder ended without a publishable GIF"; exit 1; }
          # `wc -c`, not `stat -c%s`: the GNU form is correct on ubuntu-24.04
          # and errors on macOS (BSD stat wants -f%z), but inside a command
          # substitution that error does NOT trip `set -e` - the size lands as
          # the empty string and the summary prints "size= bytes". Same shape
          # as the jq `join` trap the work step guards against: a failure that
          # renders as emptiness rather than as a non-zero exit. `wc -c < file`
          # is portable, and the value is asserted non-empty AND numeric before
          # it is reported, so a broken read can never be published as a fact.
          published_size="$(wc -c < "$gif" | tr -d '[:space:]')"
          case "$published_size" in
            '' | *[!0-9]*)
              echo "::error::could not read the size of the published GIF (got '${published_size}') - refusing to report an unread value as a measurement"
              exit 1 ;;
          esac
          echo "size=${published_size} bytes" >> "$GITHUB_STEP_SUMMARY"

      - name: Rewrite the README game block to LIVE
        id: rewrite
        if: steps.work.outputs.moves == 'true'
        run: |
          set -euo pipefail
          controls=()
          if [ "${CONTROLS_ENABLED}" = "true" ]; then controls=(--controls-enabled); fi
          # Validates the marker pair before touching a byte and writes only
          # between the markers, atomically and idempotently (must_have 8).
          # Exit 6 = marker validation failed: the file is untouched and the
          # UNAVAILABLE swap stays suppressed (write contract, row 3).
          python3 game/scripts/rewrite_readme.py --readme README.md --mapping "${MAPPING}" \
            --state LIVE "${controls[@]}" \
            --image-url "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/output/doom.gif?run=${GITHUB_RUN_ID}"

      # --- publish: GIF first, then game state, then the post_push plan ------

      - name: Push the GIF to the output branch
        id: push_gif
        if: steps.work.outputs.moves == 'true' && env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          # D10: GIF blobs live only on this force-pushed orphan branch, so
          # `main` keeps growing nothing but tiny text commits - permanently.
          # git plumbing builds the single-file parentless commit directly; no
          # branch switch, no second worktree, no index churn.
          blob="$(git hash-object -w -- "${RUNNER_TEMP}/doom.gif")"
          tree="$(printf '100644 blob %s\tdoom.gif\n' "$blob" | git mktree)"
          commit="$(git commit-tree "$tree" -m "chore(doom): publish frame for run ${GITHUB_RUN_ID}")"
          # Pushed BEFORE the README repoint, so the fresh ?run= cache key can
          # never resolve to a stale frame.
          git push --force origin "${commit}:refs/heads/output"

      - name: Push the game state
        id: push_state
        if: steps.work.outputs.moves == 'true' && env.DRY_RUN != 'true'
        env:
          ENGINE_BUILD_SHA256: ${{ steps.toolchain.outputs.engine-build-sha256 }}
        run: |
          set -euo pipefail
          controls=()
          if [ "${CONTROLS_ENABLED}" = "true" ]; then controls=(--controls-enabled); fi
          attempts="$(jq -r '.knobs.push_retry_attempts' "${MAPPING}")"
          moves="$(wc -l < "${RUNNER_TEMP}/moves.txt" | tr -d ' ')"
          pushed=false

          for attempt in $(seq 1 "$attempts"); do
            # Explicit file pathspecs only - never `git add .` or `-A`, so no
            # __pycache__, no capture.raw, nothing but game state can ever ride
            # along in a game-state commit.
            git add -- "${LEDGER}" "${STREAM}" README.md
            if git diff --cached --quiet; then
              # Moves were drained but nothing changed on disk. Committing
              # nothing and pushing successfully would close issues that are
              # NOT in the ledger - the exact lost-move failure D14 exists to
              # prevent. Fail instead: the issues stay open and the next run
              # re-drains them.
              echo "::error::${moves} move(s) drained but the working tree is unchanged - refusing to close issues that never reached the ledger"
              exit 1
            fi
            git commit -q -m "chore(doom): apply ${moves} move(s) (run ${GITHUB_RUN_ID})"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then pushed=true; break; fi

            echo "::notice::push rejected on attempt ${attempt} - regenerating on the fresh origin tip"
            # rebase is not an option on a shallow clone (no merge base in the
            # shallow set, and binary artifacts do not rebase anyway): reset to
            # the new tip and regenerate. The ledger idempotency key makes the
            # re-append safe.
            git fetch --depth 1 origin "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            # Re-applying the same batch on the fresh tip is safe by contract:
            # a move whose issue number is already anywhere in the ledger is
            # skipped, never duplicated (the D14 idempotency key).
            rc=0
            python3 game/scripts/apply_moves.py \
              --ledger "${LEDGER}" --moves "${RUNNER_TEMP}/moves.txt" \
              --mapping "${MAPPING}" --toolchain "${TOOLCHAIN}" \
              --engine-build-sha256 "${ENGINE_BUILD_SHA256}" --stream "${STREAM}" || rc=$?
            if [ "$rc" -eq 7 ]; then
              # Reachable here only if a toolchain bump landed on the branch
              # mid-run. Nothing was written; stop rather than retry.
              echo "::error::determinism pin mismatch after resetting to the fresh origin tip - the toolchain changed underneath this run. No game state was written. See game/RUNBOOK.md section 1."
              exit 1
            fi
            if [ "$rc" -ne 0 ]; then
              echo "::error::apply_moves.py failed with exit ${rc} while regenerating on the fresh tip"
              exit 1
            fi
            python3 game/scripts/rewrite_readme.py --readme README.md --mapping "${MAPPING}" \
              --state LIVE "${controls[@]}" \
              --image-url "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/output/doom.gif?run=${GITHUB_RUN_ID}"
          done

          [ "$pushed" = true ] || { echo "::error::the game-state push failed after ${attempts} attempts"; exit 1; }

      - name: Swap in the SEALED or LOG_FULL guidance screen
        id: state_swap
        # SPEC section 10, degraded-mode note, and SPEC 5.5 rule 7: a run that
        # appended no ledger line is a SUCCESS with zero appends, no GIF
        # publish, and a display-only swap. It is not a failure row of the
        # write contract - nothing failed, and no game state was ever eligible
        # to change. Nothing here may make the run red, and the summary must
        # not let it read as an error.
        #
        # The condition is SPEC 11's precedence, which is a table and not a
        # tie-break. At most one screen is written per run, by the first rule
        # that applies:
        #
        #   1. the abuse halt writes PAUSED and stops (SPEC 6) - so no step
        #      below it runs at all, `work` included;
        #   2. a run that PUBLISHES a frame shows LIVE (SPEC 10 success row). A
        #      fresh frame is truer than guidance, and the section's condition
        #      surfaces on the next run, which is also the next moment a player
        #      can act on it;
        #   3. otherwise the guidance screen selected by the SPEC 5.8 section
        #      state outranks PAUSED - a blocked section that keeps drawing
        #      moves is not idle, it is being played and answered;
        #   4. UNAVAILABLE is written only on the failure rows of SPEC 10, and
        #      never over a guidance screen the same run already pushed.
        #
        # So: STATE SELECTS THE SCREEN, A PUBLISH SUPPRESSES IT. Two terms,
        # both load-bearing, and neither is `all_rejected`:
        #
        #   - gating on all-rejected is the defect SPEC 5.8 was written to
        #     remove. A sealed section with an empty queue rejects nothing, so
        #     an all-rejected gate leaves exactly the visitor the field exists
        #     for staring at a stale frame;
        #   - the state alone is not decisive either. Rule 2 strictly precedes
        #     rule 3 and is reached by the common case, not an exotic one: a
        #     batch whose applied moves carry the section over the SPEC 6 cap
        #     reports `capped` AND publishes on the same run, and neither is a
        #     failure. `moves != 'true'` is that suppressor - it is the SPEC 10
        #     governing property ("the absence of an append") rather than a
        #     proxy for it, and with no append there was nothing to simulate,
        #     encode or push, so the LIVE frame this run would have overwritten
        #     cannot exist.
        #
        # The mirror case cannot arise: a run cannot end `sealed` and publish,
        # because while sealed the sole admissible move is the zero-frame
        # rollover (SPEC 5.5 rule 2) and applying it un-seals. So suppressing
        # guidance behind a publish can never suppress SEALED.
        #
        # Keyed on the drain's machine-readable section state via the `work`
        # step, never on the player-visible guidance prose (which is normative
        # text owned by the SPEC, not a protocol) and never on a re-derived
        # YAML constant.
        #
        # Placed before the closes on purpose: the push-then-close ordering is
        # the same discipline the drain plan is built around.
        if: >-
          steps.work.outputs.state_screen != ''
          && steps.work.outputs.moves != 'true'
          && env.DRY_RUN != 'true'
        # Display-only and best effort, exactly like the UNAVAILABLE swap: this
        # push can lose a race with another writer, and turning a spec-defined
        # SUCCESS red over a cosmetic push would also trip the sweep's
        # consecutive-failure alert. The closes below must still run.
        continue-on-error: true
        env:
          # Workflow-generated, but it travels through env like everything
          # else: this file has no `${{ ... }}` inside any run block, and the
          # invariant stays uniform and greppable.
          STATE_SCREEN: ${{ steps.work.outputs.state_screen }}
        run: |
          set -euo pipefail
          controls=()
          if [ "${CONTROLS_ENABLED}" = "true" ]; then controls=(--controls-enabled); fi

          # The `if:` above is a prefilter only - Actions expression comparison
          # folds case, so this case statement is the authoritative match.
          case "${STATE_SCREEN}" in
            SEALED)   image="${SCREEN_SEALED}" ;;
            LOG_FULL) image="${SCREEN_LOG_FULL}" ;;
            *) echo "::error::unknown state screen '${STATE_SCREEN}' - refusing to render an unmapped state"; exit 1 ;;
          esac

          python3 game/scripts/rewrite_readme.py --readme README.md --mapping "${MAPPING}" \
            --state "${STATE_SCREEN}" "${controls[@]}" \
            --image-url "$image"
          git add -- README.md
          # Already showing this screen from a previous run: nothing to push,
          # and re-running is a no-op by design (the rewriter is idempotent).
          git commit -q -m "chore(doom): show the ${STATE_SCREEN} screen (run ${GITHUB_RUN_ID})" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Close issues and post receipts
        id: post_push
        if: steps.work.outputs.closes == 'true' && env.DRY_RUN != 'true' && (steps.push_state.outcome == 'success' || steps.work.outputs.moves != 'true')
        run: |
          set -euo pipefail
          # Strictly after the pushes. "Consumed" means present in the
          # committed ledger; "closed" is UX cleanup only, so a close that
          # never happens is simply retried next run as close-only cleanup.
          gif_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/output/doom.gif?run=${GITHUB_RUN_ID}"
          reactions=true
          comments=true
          denials=0
          close_failures=0

          mapfile -t items < <(jq -c '.post_push[]' "${RUNNER_TEMP}/actions.json")
          for item in "${items[@]}"; do
            number="$(jq -r '.issue' <<< "$item")"
            action="$(jq -r '.action' <<< "$item")"
            message="$(jq -r '.message // empty' <<< "$item")"
            api="repos/${GITHUB_REPOSITORY}/issues/${number}"

            # Receipt degradation ladder (SPEC section 6): the first denial
            # drops reactions for the rest of the run, the second drops
            # comments too. Closes are always attempted.
            if [ "$action" = "close-applied" ] && [ "$reactions" = true ]; then
              if ! jq -n '{content: "rocket"}' | gh api --silent -X POST "${api}/reactions" --input -; then
                denials=$(( denials + 1 )); reactions=false
                echo "::warning::reaction denied - dropping reactions for the rest of this run"
              fi
            fi

            if [ "$comments" = true ]; then
              body=""
              case "$action" in
                close-applied)
                  # Fixed template. The only interpolated values are generated
                  # by this run; no visitor text is ever written back.
                  body="Move applied — here is the game right now:"$'\n\n'"![DOOM](${gif_url})"$'\n\n'"Run: ${RUN_URL}" ;;
                close-reject)
                  body="${message}" ;;
                close-duplicate)
                  body="" ;;
              esac
              if [ -n "$body" ]; then
                if ! jq -n --arg body "$body" '{body: $body}' | gh api --silent -X POST "${api}/comments" --input -; then
                  denials=$(( denials + 1 ))
                  if [ "$denials" -ge 2 ]; then
                    comments=false
                    echo "::warning::comment denied twice - dropping comments for the rest of this run"
                  fi
                fi
              fi
            fi

            reason=completed
            if [ "$action" != "close-applied" ]; then reason=not_planned; fi
            if ! jq -n --arg reason "$reason" '{state: "closed", state_reason: $reason}' \
                 | gh api --silent -X PATCH "${api}" --input -; then
              close_failures=$(( close_failures + 1 ))
              echo "::warning::close failed for issue #${number} - it is retried next run as close-only cleanup"
            fi
          done

          [ "$close_failures" -eq 0 ] || { echo "::error::${close_failures} issue close(s) failed"; exit 1; }

      # --- sweep tail and the failure-path write contract --------------------

      - name: Show PAUSED after inactivity
        # SPEC 11 rule 3: a guidance screen selected by the SPEC 5.8 section
        # state OUTRANKS PAUSED, so this step is suppressed whenever the `work`
        # step selected one. The suppressor is the state screen itself, not
        # `all_rejected`, for the same reason the swap gate above is not: the
        # reason codes only witness a section's state where there was a move to
        # reject, and this step is reachable in exactly the case they cannot
        # witness. Idleness is measured from the last game-state COMMIT, which
        # a blocked section never produces, so a section sealed or capped for
        # IDLE_PAUSE_DAYS crosses the idle threshold while the game is
        # demonstrably in use - and under the old `all_rejected` condition a
        # QUIET blocked game (nothing drained, nothing rejected) would have
        # sailed through and overwritten its own guidance screen with PAUSED.
        # In that state the game is not idle, it is being played and answered,
        # so PAUSED would misreport WHY the frame is not moving.
        if: >-
          github.event_name == 'schedule'
          && steps.guard.outputs.idle == 'true'
          && steps.work.outputs.moves != 'true'
          && steps.work.outputs.state_screen == ''
        run: |
          set -euo pipefail
          controls=()
          if [ "${CONTROLS_ENABLED}" = "true" ]; then controls=(--controls-enabled); fi
          # Pushed well before the 60-day scheduled-workflow auto-disable, so
          # the profile shows an honest idle state instead of a stale frame.
          python3 game/scripts/rewrite_readme.py --readme README.md --mapping "${MAPPING}" \
            --state PAUSED "${controls[@]}" \
            --image-url "${SCREEN_PAUSED}"
          git add -- README.md
          git commit -q -m "chore(doom): idle - show the paused screen (run ${GITHUB_RUN_ID})" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Swap in the UNAVAILABLE state screen
        # The failure-path write contract, implemented as a condition rather
        # than a blanket always(). It fires ONLY for the two rows that call for
        # a display-only swap:
        #   - pre-push failure (drain / apply / simulate / encode / budget), and
        #   - game-state push failure after the bounded retries.
        # It is suppressed for:
        #   - marker-validation failure (rewrite failed: the markers just failed
        #     validation, so nothing may be written inside them),
        #   - post-push failure with a landed push (push_state succeeded: a good
        #     LIVE frame is never overwritten by a failed close or receipt),
        #   - post-push failure on a close-only run (no game state was eligible
        #     to change, so the displayed frame is still accurate),
        #   - a landed SEALED/LOG_FULL swap (state_swap succeeded: the guidance
        #     screen is the accurate display and moves ARE being processed, so
        #     "moves are not being processed right now" would be a downgrade to
        #     a strictly less true statement),
        #   - runner loss / cancelation, where no step runs at all.
        #
        # Suppression keys off WHICH step failed, not off whether there were
        # moves. Gating on moves was wrong in one direction: a drain failure
        # leaves `work` skipped, so the swap never fired even though a failed
        # drain is squarely the pre-push row. That path is reachable now that
        # drain.py takes --toolchain and can exit 2/5 on it.
        if: >-
          failure()
          && steps.rewrite.outcome != 'failure'
          && steps.push_state.outcome != 'success'
          && steps.state_swap.outcome != 'success'
          && steps.post_push.outcome != 'failure'
          && env.DRY_RUN != 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          controls=()
          if [ "${CONTROLS_ENABLED}" = "true" ]; then controls=(--controls-enabled); fi
          # Display-only: reset to the origin tip first so the un-pushed ledger
          # and stream cannot ride along. Game state is never written by a
          # failed run.
          git fetch --depth 1 origin "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
          # Best effort by contract: this rewrite runs its own marker
          # validation, and its push may fail for the same root cause as the
          # run itself. Both are tolerated.
          python3 game/scripts/rewrite_readme.py --readme README.md --mapping "${MAPPING}" \
            --state UNAVAILABLE "${controls[@]}" \
            --image-url "${SCREEN_UNAVAILABLE}"
          git add -- README.md
          git commit -q -m "chore(doom): moves are not being processed (run ${GITHUB_RUN_ID})" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Summarize
        if: always()
        # Every expansion travels through env, never into the script body -
        # the same rule that keeps visitor text out of `run:` applies to
        # workflow-generated values, so the invariant is uniform and greppable:
        # this file contains no `${{ ... }}` inside any run block.
        env:
          MOVES: ${{ steps.work.outputs.moves || 'n/a' }}
          CLOSES: ${{ steps.work.outputs.closes || 'n/a' }}
          RUNG: ${{ steps.encode.outputs.rung || 'n/a' }}
          PIN_MISMATCH: ${{ steps.apply.outputs.pin-mismatch || 'false' }}
          ALL_REJECTED: ${{ steps.work.outputs.all_rejected || 'false' }}
          STATE_SCREEN: ${{ steps.work.outputs.state_screen || 'none' }}
          # `none` = the gate never returned a hard verdict, which includes the
          # case where it was never reached. It is NOT an assertion that the
          # artifact was good.
          BUDGET_FAILURE: ${{ steps.encode.outputs.budget-failure || 'none' }}
          SWAP_OUTCOME: ${{ steps.state_swap.outcome || 'skipped' }}
        run: |
          set -euo pipefail
          {
            echo "### Run"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| trigger | ${GITHUB_EVENT_NAME} |"
            echo "| dry run | ${DRY_RUN} |"
            echo "| moves applied | ${MOVES} |"
            echo "| post-push actions | ${CLOSES} |"
            echo "| ladder rung | ${RUNG} |"
            echo "| determinism pin mismatch | ${PIN_MISMATCH} |"
            echo "| all drained moves rejected | ${ALL_REJECTED} |"
            echo "| state screen | ${STATE_SCREEN} |"
            echo "| publish-gate verdict | ${BUDGET_FAILURE} |"
          } >> "$GITHUB_STEP_SUMMARY"

          # SPEC section 10, degraded-mode note. Say plainly that this run
          # succeeded: a green run with an empty ledger diff and no GIF is
          # otherwise indistinguishable at a glance from a run that quietly did
          # nothing, and an operator who reads it as a failure will go looking
          # for a fault that does not exist.
          #
          # The narrative is keyed on the STATE SCREEN, not on all_rejected.
          # The two are not the same set in EITHER direction, which is why the
          # screen is the key:
          #   - a batch rejected only for `grammar` or `cooldown` is also "all
          #     rejected", but it is ordinary operation on a live game with an
          #     accurate frame on display - calling it degraded mode, or
          #     claiming a swap that did not happen, would be false;
          #   - a section sealed or capped with an EMPTY QUEUE reports its
          #     screen (SPEC 5.8) while all_rejected is false, because there
          #     was nothing to reject. That is the case the screen exists for,
          #     so the narrative must reach it too.
          # Hence the wording below says what is true of both: no ledger line
          # landed. It does not claim moves were drained, because on the quiet
          # run none were.
          if [ "${STATE_SCREEN}" = "SEALED" ] || [ "${STATE_SCREEN}" = "LOG_FULL" ]; then
            {
              echo ""
              echo "#### Degraded mode - this run SUCCEEDED"
              echo ""
              echo "No ledger line landed this run, so there was nothing to append and nothing to"
              echo "publish. That is the defined outcome (SPEC section 10, degraded-mode note),"
              echo "not a fault - and it is the same outcome whether moves were drained and"
              echo "declined in band, the batch was entirely duplicates, or nobody submitted"
              echo "anything at all:"
              echo ""
              echo "- zero ledger appends, no GIF encode, no \`output\` push - none were eligible;"
              echo "- any rejected issues were closed with their fixed guidance message (post-push actions: ${CLOSES});"
              echo "- the README game block was swapped to \`${STATE_SCREEN}\` (swap outcome: ${SWAP_OUTCOME})."
              echo ""
              if [ "${STATE_SCREEN}" = "SEALED" ]; then
                echo "The current section is **sealed**: its header pins no longer match the running"
                echo "toolchain, so only \`doom: new game\` is admissible."
              else
                echo "The current section is at its frame cap, so only \`doom: new game\` is"
                echo "admissible."
              fi
              echo "It clears itself the first time a player submits one - **no operator action is"
              echo "required**. See game/RUNBOOK.md section 9."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "${ALL_REJECTED}" = "true" ]; then
            {
              echo ""
              echo "#### This run SUCCEEDED with nothing to apply"
              echo ""
              echo "Every move this run drained was declined by the parser or the cooldown, so"
              echo "there was nothing to append and nothing to publish. The game is live and the"
              echo "displayed frame is current - no state screen applies and none was swapped in."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
