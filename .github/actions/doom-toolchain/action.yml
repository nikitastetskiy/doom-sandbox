# Shared toolchain restore for doom.yml and ci.yml.
#
# RFC 001 "Executable integrity" (security #10) / D12, implemented once:
#   - exact-match cache keys ONLY, no restore-keys fallback (a stale binary
#     restored through a prefix fallback would bypass the section-header pin);
#   - the runner image LABEL is part of every key, never the mutable image
#     version -- SPEC 5.9, asserted in the pins step below;
#   - every restored or downloaded executable is SHA-256 verified BEFORE it is
#     executed, and a mismatch rebuilds from pinned source -- fail closed to
#     the source build, never to the artifact;
#   - build-on-miss is a first-class path (actions/cache evicts after ~7 idle
#     days, and this game can idle for weeks);
#   - ffmpeg is NEVER apt-get'd (verified absent from ubuntu-24.04, and apt
#     costs 20-40 s/run): it is the checksum-pinned static build recorded in
#     game/toolchain.json.
#
# This action is also the SINGLE IMPLEMENTATION SITE (SPEC 0.5) of the SPEC 5.9
# replay-equivalence gate: an engine built from source must replay the committed
# golden fixture to the committed digest before the job may use it. The engine
# binary's SHA-256 is provenance and is never a determinism comparand -- it is a
# property of the runner image version, which rotates. Consumers (ci.yml's
# golden-frame job) read the `engine-replay-verdict` output; they do not
# re-run the comparison.
#
# Requires the caller to have checked out game/toolchain.json already, plus
# game/tests/fixtures/golden.{stream,expected.json}, game/assets/freedoom1.wad
# and .github/toolchain/ffmpeg-shim.py for the replay gate. doom.yml's sparse
# checkout (`.github`, `game`) covers all of them.
name: DOOM toolchain
description: Restore, verify, or rebuild the pinned doomreplay engine and static ffmpeg from game/toolchain.json.

inputs:
  need-ffmpeg:
    description: Set to 'false' to skip the ffmpeg half (the golden-frame test only needs the engine).
    required: false
    default: 'true'

outputs:
  engine-bin:
    description: Absolute path to the verified doomreplay binary.
    value: ${{ steps.engine.outputs.bin }}
  engine-build-sha256:
    description: SHA-256 of the engine binary actually used by this job. PROVENANCE, never a comparand (SPEC 5.9).
    value: ${{ steps.engine.outputs.build-sha256 }}
  engine-origin:
    description: "'built-from-source' or 'restored-from-cache' - which path produced the binary, and therefore whether the SPEC 5.9 replay gate was paid."
    value: ${{ steps.engine.outputs.origin }}
  engine-pin-agrees:
    description: "'true' when the binary's SHA-256 equals the hash recorded in game/toolchain.json. False is a provenance divergence, not a fault (SPEC 5.9)."
    value: ${{ steps.engine.outputs.pin-agrees }}
  engine-replay-verdict:
    description: >-
      SPEC 5.9 replay-equivalence verdict for the binary this job will run.
      'match' = the committed golden fixture was replayed on this from-source
      build and reproduced the committed digest. 'byte-identical-pin' = no
      replay was needed, because the binary verified byte-exact against the
      recorded pin and byte identity implies behavioural identity. Any other
      value is a toolchain fault and the action has already failed the job.
    value: ${{ steps.engine.outputs.replay-verdict }}
  ffmpeg-bin:
    description: Absolute path to the verified static ffmpeg binary (empty when need-ffmpeg is 'false').
    value: ${{ steps.ffmpeg.outputs.bin }}

runs:
  using: composite
  steps:
    - name: Resolve pins from game/toolchain.json
      id: pins
      shell: bash
      run: |
        set -euo pipefail
        tc=game/toolchain.json
        test -f "$tc" || { echo "::error::$tc is missing - checkout it before this action"; exit 1; }

        # SPEC 5.9: the cache keys carry the image LABEL, never the mutable
        # image VERSION. A surviving engine entry is how a pinned binary
        # outlives an image rotation - it restores, verifies byte-exact against
        # the committed pin, and the game never notices. Keying on the rotating
        # version would evict that entry precisely when it is most useful, which
        # is the moment the from-source build stops reproducing the pin.
        # `ubuntu-24.04` is the label; `ubuntu24/20260720.247.2` - the
        # ImageOS/ImageVersion form recorded under `runner_image_sensitivity` -
        # is a version. Refuse the latter outright so the requirement cannot be
        # quietly undone by an edit to the pin file: a comment is not a guard.
        runner_image="$(jq -r '.runner_image' "$tc")"
        case "$runner_image" in
          */*)
            echo "::error::game/toolchain.json .runner_image is '${runner_image}', which is an image VERSION. The cache keys must carry the image LABEL (e.g. ubuntu-24.04) so a pinned binary survives an image rotation - see SPEC 5.9."
            exit 1 ;;
        esac

        {
          echo "engine-repo=$(jq -r '.engine.repo' "$tc")"
          echo "engine-sha=$(jq -r '.engine.commit_sha' "$tc")"
          echo "engine-build-dir=$(jq -r '.engine.build_dir' "$tc")"
          # build_cmd_linux is preferred when present: the recorded build_cmd is
          # the macOS-local one (CC=clang plus the Apple-only -dead_strip link
          # flag). See the E5 report - the Linux build command is a determinism
          # pin and belongs in game/toolchain.json, not in this YAML.
          echo "engine-build-cmd=$(jq -r '.engine.build_cmd_linux // .engine.build_cmd' "$tc")"
          echo "engine-binary=$(jq -r '.engine.binary' "$tc")"
          echo "engine-build-sha256=$(jq -r '.engine.build_sha256.value' "$tc")"
          echo "engine-pin-status=$(jq -r '.engine.build_sha256.status' "$tc")"
          echo "runner-image=${runner_image}"
          echo "ffmpeg-url=$(jq -r '.ffmpeg.url' "$tc")"
          echo "ffmpeg-tag=$(jq -r '.ffmpeg.release_tag' "$tc")"
          echo "ffmpeg-tarball-sha256=$(jq -r '.ffmpeg.tarball_sha256' "$tc")"
          echo "ffmpeg-binary-path=$(jq -r '.ffmpeg.binary_path_in_tarball' "$tc")"
          echo "ffmpeg-binary-sha256=$(jq -r '.ffmpeg.binary_sha256' "$tc")"
        } >> "$GITHUB_OUTPUT"

    # --- ffmpeg: pinned static build, exact-key cache, verify before execute ---

    - name: Restore pinned static ffmpeg
      id: ffmpeg-cache
      if: inputs.need-ffmpeg == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/doom-toolchain/ffmpeg
        # Exact match only. No restore-keys: the key carries the expected
        # SHA-256, so a hit is already an assertion about the bytes.
        key: doom-ffmpeg-${{ steps.pins.outputs.runner-image }}-${{ steps.pins.outputs.ffmpeg-tag }}-${{ steps.pins.outputs.ffmpeg-binary-sha256 }}-v1
        enableCrossOsArchive: false

    - name: Verify or fetch ffmpeg
      id: ffmpeg
      if: inputs.need-ffmpeg == 'true'
      shell: bash
      env:
        FFMPEG_DIR: ${{ runner.temp }}/doom-toolchain/ffmpeg
        FFMPEG_URL: ${{ steps.pins.outputs.ffmpeg-url }}
        FFMPEG_TARBALL_SHA256: ${{ steps.pins.outputs.ffmpeg-tarball-sha256 }}
        FFMPEG_BINARY_PATH: ${{ steps.pins.outputs.ffmpeg-binary-path }}
        FFMPEG_BINARY_SHA256: ${{ steps.pins.outputs.ffmpeg-binary-sha256 }}
      run: |
        set -euo pipefail
        bin="${FFMPEG_DIR}/ffmpeg"

        verify() {
          test -x "$1" || return 1
          echo "${FFMPEG_BINARY_SHA256}  $1" | sha256sum --check --status
        }

        if verify "$bin"; then
          echo "ffmpeg restored from cache and verified against the recorded SHA-256"
        else
          # Fail closed to a fresh, checksum-pinned download. Never apt-get,
          # and never trust the restored artifact after a mismatch.
          echo "::notice::ffmpeg cache miss or checksum mismatch - refetching the pinned static build"
          rm -rf "${FFMPEG_DIR}"
          mkdir -p "${FFMPEG_DIR}"
          tarball="${RUNNER_TEMP}/ffmpeg.tar.xz"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            --output "$tarball" -- "${FFMPEG_URL}"
          echo "${FFMPEG_TARBALL_SHA256}  ${tarball}" | sha256sum --check --status
          tar -xJf "$tarball" -C "${RUNNER_TEMP}" -- "${FFMPEG_BINARY_PATH}"
          mv "${RUNNER_TEMP}/${FFMPEG_BINARY_PATH}" "$bin"
          chmod +x "$bin"
          rm -f "$tarball"
          verify "$bin" || { echo "::error::pinned ffmpeg failed SHA-256 verification after download"; exit 1; }
        fi

        "$bin" -hide_banner -version | head -n 1
        echo "bin=${bin}" >> "$GITHUB_OUTPUT"

    - name: Save pinned static ffmpeg
      if: inputs.need-ffmpeg == 'true' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/doom-toolchain/ffmpeg
        key: ${{ steps.ffmpeg-cache.outputs.cache-primary-key }}
        enableCrossOsArchive: false

    # --- engine: pinned fork + commit, exact-key cache, verify before execute ---

    - name: Restore pinned engine build
      id: engine-cache
      # Skipped while the recorded build hash is not `canonical`: there would be
      # nothing to verify a restored binary against, and an unverified binary is
      # never executed (RFC "Executable integrity" / D12).
      if: steps.pins.outputs.engine-pin-status == 'canonical'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/doom-toolchain/engine
        # SPEC 5.9: image LABEL, engine commit, recorded build hash. The label
        # is asserted to be a label in the pins step above - a surviving entry
        # under a rotated image is the whole point, because it restores, it
        # verifies byte-exact against the committed pin, and the game never
        # notices that the from-source path would now produce different bytes.
        key: doom-engine-${{ steps.pins.outputs.runner-image }}-${{ steps.pins.outputs.engine-sha }}-${{ steps.pins.outputs.engine-build-sha256 }}-v1
        enableCrossOsArchive: false

    - name: Verify or rebuild the engine
      id: engine
      shell: bash
      env:
        ENGINE_DIR: ${{ runner.temp }}/doom-toolchain/engine
        ENGINE_REPO: ${{ steps.pins.outputs.engine-repo }}
        ENGINE_SHA: ${{ steps.pins.outputs.engine-sha }}
        ENGINE_BUILD_DIR: ${{ steps.pins.outputs.engine-build-dir }}
        ENGINE_BUILD_CMD: ${{ steps.pins.outputs.engine-build-cmd }}
        ENGINE_BINARY: ${{ steps.pins.outputs.engine-binary }}
        ENGINE_BUILD_SHA256: ${{ steps.pins.outputs.engine-build-sha256 }}
        ENGINE_PIN_STATUS: ${{ steps.pins.outputs.engine-pin-status }}
        # SPEC 5.9's evidence: the committed golden fixture and the digest it
        # must reproduce. `golden.expected.json` is the SINGLE authoring site
        # for that constant, which is why it is not mirrored into
        # game/mapping/v1.json - mirroring it would create the second site
        # SPEC 0.5 forbids.
        GOLDEN_STREAM: game/tests/fixtures/golden.stream
        GOLDEN_EXPECTED: game/tests/fixtures/golden.expected.json
        # The same ffmpeg-named PATH shim doom.yml's simulate step installs:
        # doomreplay has no raw-dump mode and popen()s a command it looks up as
        # `ffmpeg`, so this is how the framebuffer is captured. The real,
        # checksum-pinned ffmpeg is always invoked by absolute path and can
        # never be shadowed by it.
        FFMPEG_SHIM: .github/toolchain/ffmpeg-shim.py
      run: |
        set -euo pipefail
        bin="${ENGINE_DIR}/doomgeneric"

        verify() {
          test -x "$1" || return 1
          echo "${ENGINE_BUILD_SHA256}  $1" | sha256sum --check --status
        }

        if [ "${ENGINE_PIN_STATUS}" = "canonical" ] && verify "$bin"; then
          engine_origin='restored-from-cache'
          echo "engine restored from cache and verified against the recorded SHA-256"
        else
          engine_origin='built-from-source'
          if [ "${ENGINE_PIN_STATUS}" != "canonical" ]; then
            echo "::notice::engine build hash is '${ENGINE_PIN_STATUS}' - building from pinned source and reporting the computed hash"
          else
            # SPEC 5.9 failure class 1, unchanged and not weakened by anything
            # in this action: a RESTORED binary whose SHA-256 does not match
            # the recorded pin is an untrusted artifact. Discard it, rebuild
            # from the pinned commit, never execute it - executing it is the
            # risk, so it is not replay-tested either.
            echo "::notice::engine cache miss or checksum mismatch - rebuilding from the pinned commit (fail closed to source build)"
          fi
          rm -rf "${ENGINE_DIR}"
          mkdir -p "${ENGINE_DIR}"
          src="${RUNNER_TEMP}/doom-engine-src"
          rm -rf "$src"
          mkdir -p "$src"
          git init --quiet "$src"
          git -C "$src" remote add origin "${ENGINE_REPO}"
          git -C "$src" fetch --quiet --depth 1 origin "${ENGINE_SHA}"
          git -C "$src" checkout --quiet FETCH_HEAD
          head_sha="$(git -C "$src" rev-parse HEAD)"
          if [ "$head_sha" != "${ENGINE_SHA}" ]; then
            echo "::error::engine checkout is ${head_sha}, expected the pinned ${ENGINE_SHA}"
            exit 1
          fi
          ( cd "${src}/${ENGINE_BUILD_DIR}" && eval "${ENGINE_BUILD_CMD}" )
          cp "${src}/${ENGINE_BUILD_DIR}/${ENGINE_BINARY}" "$bin"
          chmod +x "$bin"
        fi

        built="$(sha256sum "$bin" | cut -d' ' -f1)"
        pin_agrees=false
        if [ "$built" = "${ENGINE_BUILD_SHA256}" ]; then pin_agrees=true; fi

        # --- SPEC 5.9: the replay is the pin, the binary is provenance -------
        #
        # `build_sha256` was treated as a determinism pin until 2026-08-03, when
        # real CI showed the proxy is wrong: the canonical ubuntu-24.04 build
        # did NOT reproduce the reference build made from the same pinned commit
        # with a clang publishing the same version string, because the binary's
        # bytes are a property of the runner IMAGE VERSION, which GitHub rotates
        # on a schedule nobody here controls. In the same runs the golden
        # fixture's 700-frame framebuffer digest reproduced BYTE-EXACT across
        # macos-arm64/Apple clang and hosted linux-amd64/Ubuntu clang. Two
        # different binaries, one identical replay - so the pin was placed on
        # the property that moves.
        #
        # The gate is therefore replay equivalence: this binary must replay the
        # committed fixture to the committed digest. It is paid ONLY on the
        # from-source path. A restored binary was proven byte-identical to one
        # that already passed this gate, and byte identity implies behavioural
        # identity, so the warm path is unchanged and the gate is paid only by
        # runs that were already paying for a compile.
        #
        # Verdicts: `match` and `byte-identical-pin` pass; everything else is
        # the SPEC 5.9 toolchain-fault class and stops the job. They are
        # separate strings rather than one `fail` because they name different
        # first debugging steps - the same discipline SPEC 12.1 spends separate
        # exit codes on.
        replay_verdict='byte-identical-pin'
        replay_digest='n/a'
        if [ "$engine_origin" = 'built-from-source' ]; then
          replay_verdict='gate-input-unavailable'
          if [ -f "${GOLDEN_STREAM}" ] && [ -f "${GOLDEN_EXPECTED}" ] && [ -f "${FFMPEG_SHIM}" ]; then
            replay_verdict='fixture-corrupt'
            fixture_sha="$(jq -r '.fixture_sha256' "${GOLDEN_EXPECTED}")"
            if echo "${fixture_sha}  ${GOLDEN_STREAM}" | sha256sum --check --status; then
              shim_dir="${ENGINE_DIR}-shim"
              rm -rf "$shim_dir"
              mkdir -p "$shim_dir"
              install -m 0755 "${FFMPEG_SHIM}" "${shim_dir}/ffmpeg"
              capture="${RUNNER_TEMP}/doom-toolchain/golden.raw"
              rm -f "$capture"

              # argv comes from the fixture, not from this file: argv[0] is
              # replaced with the binary under test, and the capture
              # placeholder with a temp path. The element count is asserted
              # against the JSON array's own length, so an element carrying a
              # newline fails loudly here rather than silently splitting into
              # two arguments and replaying something other than the fixture.
              mapfile -t argv < <(jq -r --arg bin "$bin" --arg cap "$capture" \
                '.invocation.argv
                 | .[0] = $bin
                 | map(if . == "<raw-capture-path>" then $cap else . end)
                 | .[]' "${GOLDEN_EXPECTED}")
              want_argc="$(jq -r '.invocation.argv | length' "${GOLDEN_EXPECTED}")"
              if [ "${#argv[@]}" -ne "$want_argc" ]; then
                echo "::error::${GOLDEN_EXPECTED} invocation.argv has ${want_argc} element(s) but ${#argv[@]} argument(s) were read - an element carries a newline, so the replay would not be the committed invocation"
                exit 1
              fi

              replay_rc=0
              PATH="${shim_dir}:${PATH}" "${argv[@]}" < /dev/null || replay_rc=$?
              want_bytes="$(jq -r '.recorded_frames * .frame_bytes' "${GOLDEN_EXPECTED}")"
              got_bytes=0
              if [ -f "$capture" ]; then got_bytes="$(wc -c < "$capture" | tr -d '[:space:]')"; fi

              if [ "$replay_rc" -ne 0 ]; then
                replay_verdict='replay-failed'
              elif [ "$got_bytes" -eq 0 ]; then
                replay_verdict='no-capture'
              elif [ "$got_bytes" -ne "$want_bytes" ]; then
                replay_verdict='frame-count'
              else
                replay_digest="$(sha256sum "$capture" | cut -d' ' -f1)"
                if [ "$replay_digest" = "$(jq -r '.recorded_stream_sha256' "${GOLDEN_EXPECTED}")" ]; then
                  replay_verdict='match'
                else
                  replay_verdict='divergent'
                fi
              fi
              rm -f "$capture"
            fi
          fi
        fi

        {
          echo "bin=${bin}"
          echo "build-sha256=${built}"
          echo "origin=${engine_origin}"
          echo "pin-agrees=${pin_agrees}"
          echo "replay-verdict=${replay_verdict}"
        } >> "$GITHUB_OUTPUT"
        # SPEC 5.9 observability, and the distinction it needs. SPEC 5.5's
        # property is a property of COMMITTED STATE, true or false whether or
        # not anything runs, so it demands a witness on a run that does nothing
        # (SPEC 5.8). This section's property is a property of AN EXECUTION -
        # absent a running engine it has no truth value at all - so its witness
        # is per-execution, and its obligation is to be unconditional within
        # every execution that acquires an engine. Hence: one greppable line,
        # emitted on every invocation, BEFORE any verdict can stop the job.
        #
        # It goes to stdout, not only to the step summary: $GITHUB_STEP_SUMMARY
        # is not exposed by ANY REST endpoint (`check-runs/{id}.output.summary`
        # is null for Actions jobs), so a value written only there cannot be
        # read back off a finished run - a witness to whoever happened to be
        # looking, which is nobody by the time it matters.
        #
        # It carries enough of its own provenance to be worth reading later:
        # WHAT was observed (the build hash and the replay digest), WHERE it
        # came from (`origin=` distinguishes a compiled binary from a restored
        # one), ON WHAT (`runner-image=`; ImageOS/ImageVersion are set by
        # GitHub-hosted runners only, so the pair proves a real hosted image and
        # names the version this binary's bytes are a property of), and WHETHER
        # IT REPLAYS (`replay=`, the verdict that actually gates determinism).
        # Defaulted so `set -u` cannot trip on a self-hosted or act runner.
        echo "doom-toolchain: engine-build-sha256=${built} pin-status=${ENGINE_PIN_STATUS} pin-agrees=${pin_agrees} origin=${engine_origin} replay=${replay_verdict} replay-sha256=${replay_digest} runner-image=${ImageOS:-unknown}/${ImageVersion:-unknown}"
        {
          echo "### DOOM engine"
          echo ""
          echo "| field | value |"
          echo "| --- | --- |"
          echo "| pinned commit | \`${ENGINE_SHA}\` |"
          echo "| recorded build SHA-256 | \`${ENGINE_BUILD_SHA256}\` (${ENGINE_PIN_STATUS}) |"
          echo "| built SHA-256 (this run) | \`${built}\` (agrees: ${pin_agrees}) |"
          echo "| binary origin | ${engine_origin} |"
          echo "| replay verdict (SPEC 5.9) | \`${replay_verdict}\` |"
          echo "| replay SHA-256 | \`${replay_digest}\` |"
          echo "| runner image | \`${ImageOS:-unknown}/${ImageVersion:-unknown}\` |"
        } >> "$GITHUB_STEP_SUMMARY"

        # SPEC 5.9 failure class 3: a from-source build whose replay digest does
        # not match the committed one is a TOOLCHAIN FAULT and the job stops.
        # This hard failure is retained deliberately and the correction was to
        # its TRIGGER, not to its class: a same-commit replay divergence is a
        # defect in the build environment whose repair is an operator re-pinning
        # a toolchain, not a player pressing a button. Sealing it would ask a
        # visitor to discard their session to work around a broken runner, and
        # would file a real fault behind a screen saying the arcade is being
        # upgraded. What was wrong before was firing it at binaries that replay
        # correctly. The run then takes the SPEC 10 pre-push row: game state
        # untouched, best-effort UNAVAILABLE, issues stay open, and the sweep's
        # consecutive-failure alert reaches the operator.
        case "$replay_verdict" in
          match|byte-identical-pin) ;;
          divergent)
            echo "::error::the engine built from pinned commit ${ENGINE_SHA} does not reproduce the committed golden replay: got ${replay_digest}, expected $(jq -r '.recorded_stream_sha256' "${GOLDEN_EXPECTED}"). Same input, different frames - this is a broken build environment (SPEC 5.9 toolchain fault), not a game event. See game/RUNBOOK.md section 12."
            exit 1 ;;
          *)
            # A gate that cannot establish its property has not passed it
            # (SPEC 0), so an unevaluable gate is a failure and never a pass.
            echo "::error::the SPEC 5.9 replay-equivalence gate could not be evaluated for this from-source build (verdict: ${replay_verdict}). No determinism evidence exists for this binary, so it is not used. See game/RUNBOOK.md section 12."
            exit 1 ;;
        esac

        # SPEC 5.9 failure class 2, reached only once the replay has PASSED: a
        # from-source hash that disagrees with the recorded pin is a provenance
        # divergence and NOT a fault. The binary's bytes are a property of the
        # runner image version; the replay is the property the game depends on,
        # and it just matched.
        if [ "$engine_origin" = 'built-from-source' ] \
           && [ "${ENGINE_PIN_STATUS}" = 'canonical' ] && [ "$pin_agrees" != 'true' ]; then
          echo "::notice::SPEC 5.9 provenance divergence (NOT a fault): this from-source build hashes ${built} while game/toolchain.json records ${ENGINE_BUILD_SHA256} - almost certainly a runner image rotation, which is an infrastructure event with no game meaning. The replay matched, so determinism holds and the run proceeds. The pin is NOT rewritten (a runtime that re-pins itself certifies nothing, and SPEC 5.6 rule 1 forbids runtime rewriting of committed pins) and NO cache entry is saved, because the key names a hash this binary does not carry. Cost until an operator re-pins at leisure: one rebuild per run. See game/RUNBOOK.md section 12."
        fi

    - name: Save pinned engine build
      # SPEC 5.9: never save under a key naming a hash the binary does not
      # carry. A from-source build that diverged from the pin is legitimate to
      # RUN (its replay matched) but not to CACHE - an entry stored under the
      # recorded hash would be restored on a later run, fail the byte-exact
      # verify, and be discarded unexecuted anyway. `pin-agrees` is that gate.
      if: >-
        steps.pins.outputs.engine-pin-status == 'canonical'
        && steps.engine-cache.outputs.cache-hit != 'true'
        && steps.engine.outputs.pin-agrees == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/doom-toolchain/engine
        key: ${{ steps.engine-cache.outputs.cache-primary-key }}
        enableCrossOsArchive: false
